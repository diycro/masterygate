name: CI

on:
  push:
    paths: ["learning-studio/**"]
  pull_request:
    paths: ["learning-studio/**"]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build & test backend
        run: mvn -f learning-studio/backend/pom.xml -B verify
