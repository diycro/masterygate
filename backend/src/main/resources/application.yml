spring:
  application:
    name: learning-studio
  # We only use the OpenAI-compatible CHAT model. Exclude the other OpenAI model
  # auto-configs (speech/image/etc.) — they eagerly demand a key at startup even
  # though we never call them, which would break booting without a key.
  autoconfigure:
    exclude:
      # Flyway migrations are Postgres-specific; the default profile uses H2 with Hibernate
      # ddl-auto, so keep Flyway off here (it's used only under the 'postgres' profile).
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      # We only use the OpenAI-compatible CHAT model; skip the other model auto-configs that
      # eagerly demand a key at startup.
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
  # Default persistence: embedded H2 in FILE mode — survives restarts, needs no Docker.
  # The DB file lives at ./data/studio.mv.db. For Postgres, run with --spring.profiles.active=postgres.
  datasource:
    url: jdbc:h2:file:./data/studio;AUTO_SERVER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  ai:
    openai:
      # The chat auto-config demands a non-empty key at startup, so we default to a placeholder
      # ("not-set"): the app always boots, and LLM calls just fail gracefully until you set a real
      # GROQ_API_KEY. Using Groq's OpenAI-compatible endpoint — base-url stops at /openai, Spring AI
      # appends /v1/chat/completions itself (setting /openai/v1 would double the /v1).
      api-key: ${GROQ_API_KEY:not-set}
      base-url: https://api.groq.com/openai
      chat:
        options:
          model: llama-3.3-70b-versatile
          temperature: 0.7

server:
  port: 8080

# App-specific settings (feature flags live in the DB; these are static defaults)
studio:
  llm:
    provider: openai
    daily-call-cap: 200

# Optional: a free YouTube Data API v3 key enables highly-viewed community videos per module.
# Get one at https://console.cloud.google.com (enable "YouTube Data API v3" -> create API key).
# Without it, modules simply show the curated resources — nothing breaks.
youtube:
  api-key: ${YOUTUBE_API_KEY:}
