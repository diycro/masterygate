spring:
  application:
    name: learning-studio
  datasource:
    url: jdbc:postgresql://localhost:5432/studio
    username: studio
    password: studio
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    openai:
      # BYOK: leave empty to boot without the model; set it to enable /api/llm/hello.
      # Using Groq's OpenAI-compatible endpoint. base-url stops at /openai — Spring AI
      # appends /v1/chat/completions itself (setting /openai/v1 would double the /v1).
      api-key: ${GROQ_API_KEY:}
      base-url: https://api.groq.com/openai
      chat:
        options:
          model: llama-3.3-70b-versatile
          temperature: 0.7

server:
  port: 8080

# App-specific settings (feature flags live in the DB; these are static defaults)
studio:
  llm:
    provider: openai
    daily-call-cap: 200
