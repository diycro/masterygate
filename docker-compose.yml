# Sprint 0 infra: Postgres (with pgvector) + Redis.
# Start with:  docker compose up -d
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: studio-db
    environment:
      POSTGRES_DB: studio
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
    ports:
      - "5432:5432"
    volumes:
      - studio_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: studio-redis
    ports:
      - "6379:6379"

volumes:
  studio_db:
